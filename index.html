<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="header">
      <div class="brand">
        <h1>2048</h1>
        <p class="hint">方向键或 WASD 移动 · Ctrl+Z 撤销 · R 重开</p>
      </div>
    </header>

    <!-- 五个指标同一套仪表语言：上标签、下数值；限时以外模式计时器整格隐藏 -->
    <div class="hud">
      <div class="hud-item hud-item--score" aria-live="polite">
        <span class="hud-label">得分</span>
        <span class="hud-value" id="score">0</span>
        <span class="hud-gain" id="scoreGain" aria-hidden="true"></span>
      </div>
      <div class="hud-item">
        <span class="hud-label">最高</span>
        <span class="hud-value" id="best">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">目标</span>
        <span class="hud-value" id="goal"></span>
      </div>
      <div class="hud-item">
        <span class="hud-label">最大</span>
        <span class="hud-value" id="maxTile"></span>
      </div>
      <!-- 文本由控制器整段写入，标签只能走 ::before，不能放子元素 -->
      <div class="hud-item hud-timer" id="timer" hidden></div>
    </div>

    <div class="controls" id="extras">
      <button class="btn btn--primary" id="newGame" type="button">新游戏</button>
      <button class="btn" id="undo" type="button" disabled>撤销</button>
      <button class="btn" id="hint" type="button">提示</button>
      <button class="btn btn--toggle" id="autoplay" type="button" aria-pressed="false">托管：关</button>
      <button class="btn btn--toggle is-active" id="openSettings" type="button" aria-expanded="true" aria-controls="settingsPanel">设置</button>
    </div>

    <div class="settings" id="settingsPanel">
      <span class="settings-label" id="sizeLabel">尺寸</span>
      <div class="settings-group" id="sizeGroup" role="group" aria-labelledby="sizeLabel">
        <button class="btn btn--chip" type="button" data-size="4" aria-pressed="false">4×4</button>
        <button class="btn btn--chip" type="button" data-size="5" aria-pressed="false">5×5</button>
        <button class="btn btn--chip" type="button" data-size="6" aria-pressed="false">6×6</button>
      </div>

      <span class="settings-label" id="modeLabel">模式</span>
      <div class="settings-group" id="modeGroup" role="group" aria-labelledby="modeLabel">
        <button class="btn btn--chip" type="button" data-mode="classic" aria-pressed="false">经典</button>
        <button class="btn btn--chip" type="button" data-mode="timed" aria-pressed="false">限时</button>
        <button class="btn btn--chip" type="button" data-mode="obstacle" aria-pressed="false">障碍</button>
      </div>

      <button class="btn btn--toggle btn--switch" id="soundToggle" type="button" aria-pressed="true">音效：开</button>
    </div>

    <div class="board" id="board" tabindex="0" role="application" aria-label="4×4 棋盘">
      <div class="grid-layer" id="gridLayer"></div>
      <div class="tile-layer" id="tileLayer"></div>
      <div class="overlay" id="overlay" hidden>
        <p class="overlay-title" id="overlayTitle"></p>
        <p class="overlay-text" id="overlayText"></p>
        <div class="overlay-actions" id="overlayActions"></div>
      </div>
    </div>

    <footer class="footer">
      <span id="status">用方向键开始</span>
    </footer>
  </main>

  <script src="js/logic.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

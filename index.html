<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="header">
      <div class="brand">
        <h1>2048</h1>
        <p class="hint">方向键或 WASD 移动 · Ctrl+Z 撤销 · R 重开</p>
      </div>
      <div class="scores" aria-live="polite">
        <div class="score-box">
          <span class="score-label">得分</span>
          <span class="score-value" id="score">0</span>
          <span class="score-gain" id="scoreGain" aria-hidden="true"></span>
        </div>
        <div class="score-box score-box--best">
          <span class="score-label">最高</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="hud">
      <span class="hud-item">目标 <b class="hud-value" id="goal"></b></span>
      <span class="hud-item">最大 <b class="hud-value" id="maxTile"></b></span>
      <span class="hud-item hud-timer" id="timer"></span>
    </div>

    <div class="toolbar">
      <button class="btn btn--primary" id="newGame" type="button">新游戏</button>
      <button class="btn" id="undo" type="button" disabled>撤销</button>
    </div>

    <!-- 多尺寸 / 模式 / 音效 / 提示 / 托管 由后续任务填充，先留空容器 -->
    <div class="extras" id="extras" hidden>
      <div class="toolbar">
        <button class="btn" id="hint" type="button"></button>
        <button class="btn" id="autoplay" type="button"></button>
        <button class="btn" id="openSettings" type="button"></button>
      </div>
      <div class="settings">
        <div class="settings-group" id="sizeGroup" role="group" aria-label="棋盘尺寸"></div>
        <div class="settings-group" id="modeGroup" role="group" aria-label="游戏模式"></div>
        <button class="btn btn--toggle" id="soundToggle" type="button"></button>
      </div>
    </div>

    <div class="board" id="board" tabindex="0" role="application" aria-label="4×4 棋盘">
      <div class="grid-layer" id="gridLayer"></div>
      <div class="tile-layer" id="tileLayer"></div>
      <div class="overlay" id="overlay" hidden>
        <p class="overlay-title" id="overlayTitle"></p>
        <p class="overlay-text" id="overlayText"></p>
        <div class="overlay-actions" id="overlayActions"></div>
      </div>
    </div>

    <footer class="footer">
      <span id="status">用方向键开始</span>
    </footer>
  </main>

  <script src="js/logic.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
